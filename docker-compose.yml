services:
  postgres:
    image: postgres:16-alpine
    container_name: signage-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=signage
      - POSTGRES_PASSWORD=signage
      - POSTGRES_DB=signage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - signage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage"]
      interval: 5s
      timeout: 5s
      retries: 5
    
